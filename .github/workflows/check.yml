name: Torvik checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          NITRO_PRESET: vercel
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:e2e tests/e2e/auth.spec.ts tests/e2e/i18n-auth.spec.ts
        env:
          TORVIK_AUTH_TEST: "1"
          VITE_SUPABASE_URL: https://torvik-auth-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
